actor: ApiTester
modules:
  enabled:
    - REST:
        url: https://petstore.swagger.io/v2/
        depends: PhpBrowser
    - PhpBrowser:
        url: https://petstore.swagger.io/v2/
    - Asserts
    - Tests\Support\Helper\SendRequests
    - Tests\Support\Helper\SetHeaders
    - Tests\Support\Helper\CheckResponse